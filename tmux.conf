# kitty: truecolor + undercurls + styled underlines
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
set -g mouse on
set -g extended-keys on
set -g extended-keys-format csi-u

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D 
bind k select-pane -U
bind l select-pane -R

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Shift Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# Ctrl+Shift+H/L to switch windows (kitty send_text emits xterm S-F1/S-F2 sequences)
bind -n S-F1 previous-window
bind -n S-F2 next-window


# QoL defaults (inlined from tmux-sensible; tmux-yank removed)
set -s escape-time 0
set -g history-limit 50000
set -g display-time 4000
set -g status-interval 5
set -g focus-events on


# catppuccin mocha status bar (manual load; TPM has name conflicts with this repo)
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "slanted"
set -g @catppuccin_pane_status_enabled "yes"
set -g @catppuccin_window_text " #{?#{m/r:^(zsh|bash|fish)$,#{pane_current_command}},,#($HOME/.config/tmux/scripts/pane_cmd.sh #{pane_current_command} #{pane_pid}) · }#{?#{==:#{pane_current_path},/Users/victorperezcano},~,#{b:pane_current_path}}"
set -g @catppuccin_window_current_text " #{?#{m/r:^(zsh|bash|fish)$,#{pane_current_command}},,#($HOME/.config/tmux/scripts/pane_cmd.sh #{pane_current_command} #{pane_pid}) · }#{?#{==:#{pane_current_path},/Users/victorperezcano},~,#{b:pane_current_path}}"
set -g status-justify left
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# boxed panes: title bar only when the window has 2+ panes (format below)
set -g pane-border-status off
set -g pane-border-lines single
set-hook -g after-split-window 'set -wF pane-border-status "#{?#{==:#{window_panes},1},off,top}"'
set-hook -g after-kill-pane   'set -wF pane-border-status "#{?#{==:#{window_panes},1},off,top}"'
set-hook -g pane-exited       'set -wF pane-border-status "#{?#{==:#{window_panes},1},off,top}"'
# pane bar: command name only; bare border line when just a shell is running
set -wg pane-border-format '#($HOME/.config/tmux/scripts/pane_border.sh #{pane_current_command} #{pane_pid})'

set -g status-left ""
set -g status-right ""
set -ag status-right '#($HOME/.config/tmux/scripts/gitmux_segment.sh "#{pane_current_path}")'

# set vi-mode
set-window-option -g mode-keys vi
# keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind - split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind t new-window -c "#{pane_current_path}"

set -g set-titles on

bind Tab next-window
bind BTab previous-window

set -g allow-passthrough on

# --- QoL --------------------------------------------------------------------
bind r source-file ~/.config/tmux/tmux.conf \; display "config reloaded"
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
set -g detach-on-destroy off

# --- smart-splits: seamless nvim/tmux pane navigation --------------------------
# (@pane-is-vim is set per-pane by the smart-splits nvim plugin)
bind-key -n C-h if -F '#{@pane-is-vim}' { send-keys C-h } { select-pane -L }
bind-key -n C-j if -F '#{@pane-is-vim}' { send-keys C-j } { select-pane -D }
bind-key -n C-k if -F '#{@pane-is-vim}' { send-keys C-k } { select-pane -U }
bind-key -n C-l if -F '#{@pane-is-vim}' { send-keys C-l } { select-pane -R }
bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R

