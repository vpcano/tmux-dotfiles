# kitty: truecolor + undercurls + styled underlines
set -g default-terminal "tmux-256color"
set -s terminal-features "xterm*:clipboard:ccolour:cstyle:focus:title,screen*:title,rxvt*:ignorefkeys,xterm-kitty:RGB:extkeys"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
set -g mouse on
set -g extended-keys on
set -g extended-keys-format csi-u

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D 
bind k select-pane -U
bind l select-pane -R

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Ctrl+Shift+H/L to switch windows (kitty send_text emits xterm S-F1/S-F2 sequences)
bind -n S-F1 previous-window
bind -n S-F2 next-window

# cycle panels
bind Tab next-window
bind BTab previous-window


# (@pane-is-vim is set per-pane by the smart-splits nvim plugin)
bind-key -n C-h if -F '#{@pane-is-vim}' { send-keys C-h } { select-pane -L }
bind-key -n C-j if -F '#{@pane-is-vim}' { send-keys C-j } { select-pane -D }
bind-key -n C-k if -F '#{@pane-is-vim}' { send-keys C-k } { select-pane -U }
bind-key -n C-l if -F '#{@pane-is-vim}' { send-keys C-l } { select-pane -R }

bind -n C-M-h if -F '#{@pane-is-vim}' { send-keys M-h } { resize-pane -L 3 }
bind -n C-M-j if -F '#{@pane-is-vim}' { send-keys M-j } { resize-pane -D 3 }
bind -n C-M-k if -F '#{@pane-is-vim}' { send-keys M-k } { resize-pane -U 3 }
bind -n C-M-l if -F '#{@pane-is-vim}' { send-keys M-l } { resize-pane -R 3 }

bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R


# catppuccin mocha status bar (manual load; TPM has name conflicts with this repo)
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "slanted"
set -g @catppuccin_pane_status_enabled "yes"
set -g @catppuccin_window_text " #{?#{m/r:^(zsh|bash|fish)$,#{pane_current_command}},,#($HOME/.config/tmux/scripts/pane_cmd.sh #{pane_current_command} #{pane_pid}) · }#{?#{==:#{pane_current_path},/Users/victorperezcano},~,#{b:pane_current_path}}"
set -g @catppuccin_window_current_text " #{?#{m/r:^(zsh|bash|fish)$,#{pane_current_command}},,#($HOME/.config/tmux/scripts/pane_cmd.sh #{pane_current_command} #{pane_pid}) · }#{?#{==:#{pane_current_path},/Users/victorperezcano},~,#{b:pane_current_path}}"
set -g status-justify left
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# popups
set -g popup-border-style "#{pane-active-border-style}"
set -g popup-border-lines "rounded"
bind-key -T prefix C-g display-popup -w 80% -h 80% -T "lazygit" -d "#{pane_current_path}" -E lazygit
bind-key -T prefix C-d display-popup -w 80% -h 80% -T "lazydocker" -d "#{pane_current_path}" -E lazydocker
# yazi file chooser: Enter opens in a new window, <C-v>/<C--> open in a split; all close the popup.
# run-shell expands #{pane_id} (display-popup itself doesn't expand formats in -e/command)
bind-key -T prefix C-y run-shell -b "tmux display-popup -w 80% -h 80% -T yazi -d \"#{pane_current_path}\" -e YAZI_ORIGIN_PANE=#{pane_id} -E \"$HOME/.config/tmux/scripts/yazi-popup.sh\""

# boxed panes: title bar only when the window has 2+ panes (format below)
set -g pane-border-status off
set -g pane-border-lines single
set-hook -g after-split-window 'set -wF pane-border-status "#{?#{==:#{window_panes},1},off,top}"'
set-hook -g after-kill-pane   'set -wF pane-border-status "#{?#{==:#{window_panes},1},off,top}"'
set-hook -g pane-exited       'set -wF pane-border-status "#{?#{==:#{window_panes},1},off,top}"'
# pane bar: command name only; bare border line when just a shell is running
set -wg pane-border-format '#($HOME/.config/tmux/scripts/pane_border.sh #{pane_current_command} #{pane_pid})'

# status-left: current session pill, slanted style matching the windows.
# Icon pill is green, turns red while the prefix key is held (catppuccin default).
set -g status-left-length 40
set -g status-left '#[fg=#{?client_prefix,#{E:@thm_red},#{E:@thm_green}}]'
set -ag status-left '#[fg=#{@thm_crust},bg=#{?client_prefix,#{E:@thm_red},#{E:@thm_green}}] '
set -ag status-left '#[fg=#{?client_prefix,#{E:@thm_red},#{E:@thm_green}},bg=#{@thm_surface_0}]'
set -ag status-left '#[fg=#{@thm_fg},bg=#{@thm_surface_0}] #S '
set -ag status-left '#[fg=#{@thm_surface_0},bg=#{@thm_mantle}]█ '
set -g status-right ""
set -ag status-right '#($HOME/.config/tmux/scripts/gitmux_segment.sh "#{pane_current_path}")'

# set vi-mode
set-window-option -g mode-keys vi
# keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind - split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind t new-window -c "#{pane_current_path}"


# --- QoL --------------------------------------------------------------------
bind r source-file ~/.config/tmux/tmux.conf \; display "config reloaded"
set -g detach-on-destroy off
set -g set-titles on
set -g allow-passthrough on
set -s escape-time 0
set -g history-limit 50000
set -g display-time 4000
set -g status-interval 5
set -g focus-events on



